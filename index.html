<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Esports Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0d14;
    --panel: #121722;
    --panel-2: #181f2d;
    --line: #263043;
    --line-2: #34405a;
    --text: #e8ecf3;
    --muted: #8b95a8;
    --gold: #c8aa6e;
    --live: #ff4655;
    --radius: 10px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 Inter, system-ui, -apple-system, Segoe UI, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 16px 64px; }
  header { padding: 40px 0 26px; border-bottom: 1px solid var(--line); margin-bottom: 26px; }
  h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.01em; }
  h1 span { color: var(--gold); }
  header p { margin: 6px 0 0; color: var(--muted); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--gold); margin: 0 0 14px; }
  .games { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); gap: 14px; }
  .game {
    display: flex; flex-direction: column; gap: 14px; padding: 20px; color: inherit; text-decoration: none;
    background: linear-gradient(160deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: var(--radius);
    transition: border-color .15s, transform .15s;
  }
  .game:hover, .game:focus-visible { border-color: var(--gold); transform: translateY(-2px); outline: none; }
  .game-top { display: flex; align-items: center; gap: 14px; }
  .game img { width: 52px; height: 52px; object-fit: contain; flex: none; }
  .game b { display: block; font-size: 18px; font-weight: 800; }
  .game small { color: var(--muted); font-size: 13px; }
  .game-status { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; min-height: 20px; }
  .game-status.live { color: var(--live); }
  .game-go { margin-left: auto; color: var(--gold); }
  .live-pip { width: 8px; height: 8px; border-radius: 50%; background: var(--live); display: inline-block; animation: pulse 1.4s infinite; flex: none; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .note { color: var(--muted); font-size: 12px; margin-top: 26px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Esports <span>Tracker</span></h1>
    <p>Live brackets, in-game stats, and spoiler-free rewatches.</p>
  </header>

  <h2>Pick a game</h2>
  <div class="games">
    <a class="game" href="lol/">
      <span class="game-top">
        <img src="https://static.lolesports.com/leagues/1592594612171_WorldsDarkBG.png" alt="" onerror="this.remove()">
        <span><b>League of Legends</b><small>Worlds 2026 · Oct 15 – Nov 14</small></span>
      </span>
      <span class="game-status" id="lolStatus"><span id="lolText">Brackets, live stats &amp; rewatches</span><span class="game-go">Open →</span></span>
    </a>
  </div>
  <p class="note">More games coming later.</p>
</div>

<script>
// Links to the old single-page tracker (e.g. /#swiss) now live under /lol/.
if (/^#(playin|swiss|ko)$/.test(location.hash)) location.replace(`lol/${location.hash}`);

// Live badge for League. With no-spoilers on in the tracker, don't name the teams.
(async () => {
  try {
    const res = await fetch('https://esports-api.lolesports.com/persisted/gw/getLive?hl=en-US', {
      headers: { 'x-api-key': '0TvQnueqKa5mxJntVWt0w4LpLfEkrV1Ta8rQBb9Z' }, // public key the lolesports.com site itself uses
    });
    const ev = ((await res.json()).data.schedule.events || []).find(e => e.league?.slug === 'worlds' && e.state === 'inProgress');
    if (!ev) return;
    let quiet = false;
    try { quiet = !!JSON.parse(localStorage.getItem('worlds2026.nospoil.v1'))?.on; } catch {}
    const [a, b] = ev.match?.teams || [];
    document.getElementById('lolStatus').classList.add('live');
    document.getElementById('lolText').outerHTML = `<span class="live-pip"></span><span>${quiet || !a || !b ? 'Live now' : `Live: ${a.code} vs ${b.code}`}</span>`;
  } catch {}
})();
</script>
</body>
</html>
